name: Clean Upstream Full Tests

on:
  push:
    branches:
      - test/clean-upstream-full
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build clean upstream source
        run: npm run build
      - name: Run every upstream test
        run: npm test
