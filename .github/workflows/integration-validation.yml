name: Talon Integration Validation

on:
  push:
    branches:
      - integration/full-stack
  pull_request:
    branches:
      - integration/full-stack
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talon-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Compile and regression tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Run full test suite
        run: npm test
      - name: Verify Home Assistant overlay compatibility checks
        run: node --test talon-haos/install-runtime-overlays.test.cjs
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

  addon:
    name: Build source-based HAOS staging image
    runs-on: ubuntu-latest
    needs: source
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build only (do not publish or deploy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: talon-haos/Dockerfile.source
          platforms: linux/amd64
          push: false
          tags: talon-haos:integration-check
