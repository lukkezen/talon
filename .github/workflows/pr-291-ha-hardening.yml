name: PR 291 HA Add-on Validation
on:
  push:
    branches: [test/pr-291-ha-hardening]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: POSIX shell syntax
        run: sh -n talon-haos/run.sh talon-haos/talonctl
      - name: Check ingress gate syntax
        run: node --check talon-haos/ingress-proxy.cjs
      - name: Build Home Assistant add-on image
        run: docker build --build-arg BUILD_VERSION=1.0.1 --build-arg BUILD_ARCH=amd64 -t talon-haos:test ./talon-haos

      - name: Verify downloaded ttyd candidate hash
        run: docker run --rm --entrypoint sha256sum talon-haos:test /usr/local/bin/ttyd

      - name: Smoke test default workspace and non-root daemon
        run: |
          echo '{"openai_api_key":"test-key"}' > "$RUNNER_TEMP/talon-options.json"
          docker run -d --name talon-ha-smoke -v "$RUNNER_TEMP/talon-options.json:/data/options.json:ro" talon-haos:test
          sleep 8
          docker logs talon-ha-smoke
          test "$(docker inspect -f '{{.State.Running}}' talon-ha-smoke)" = "true"
          docker exec talon-ha-smoke sh -c 'ps -eo user,args | grep -E "[n]ode /opt/talond/dist/index.js" | grep talond'
          docker stop -t 30 talon-ha-smoke
          docker rm talon-ha-smoke
