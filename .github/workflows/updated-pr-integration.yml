name: Talon combined integration

on:
  push:
    branches:
      - integration/test-release-2026-10-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talon-combined-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-suite:
    name: Build and full cross-feature suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build combined branch
        run: npm run build
      - name: Full Talon regression suite
        run: npm test
